<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birdology — Graph-RAG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(380px, 1fr) 1.3fr;
    grid-template-areas:
      "header header"
      "chat   panels";
    overflow: hidden;
  }

  header {
    grid-area: header;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 20px; font-weight: 600; color: #f0f0f0; }
  header .badge { font-size: 11px; background: #2d5a3d; color: #7dcea0; padding: 3px 8px; border-radius: 10px; }

  #weekend-btn {
    margin-left: auto;
    background: #2d5a3d;
    border: none;
    color: #7dcea0;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #weekend-btn:hover { background: #3a7a50; }
  #weekend-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #new-chat-btn {
    background: transparent;
    border: 1px solid #3a3d4a;
    color: #a0a8c0;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #new-chat-btn:hover { border-color: #7dcea0; color: #7dcea0; }

  /* ── Left column: chat ─────────────────────────────────────────── */
  #chat-column {
    grid-area: chat;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid #2a2d3a;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .message { line-height: 1.6; }

  .message.user {
    background: #1e3a5f;
    border-radius: 16px 16px 4px 16px;
    padding: 10px 16px;
    align-self: flex-end;
    max-width: 90%;
    width: fit-content;
  }

  .message.assistant {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 4px 16px 16px 16px;
    padding: 14px 18px;
  }

  .message.assistant h3 { color: #7dcea0; margin: 14px 0 6px 0; font-size: 15px; }
  .message.assistant h3:first-child { margin-top: 0; }
  .message.assistant ul, .message.assistant ol { padding-left: 20px; margin: 6px 0; }
  .message.assistant li { margin: 4px 0; }
  .message.assistant strong { color: #f0f0f0; }
  .message.assistant em { color: #a0a8c0; }
  .message.assistant code { background: #252830; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
  .message.assistant hr { border: none; border-top: 1px solid #2a2d3a; margin: 12px 0; }
  .message.assistant a { color: #7dcea0; text-decoration: underline; text-decoration-color: #3a5a4a; }
  .message.assistant a:hover { color: #a0e8c0; }
  .message.assistant img { max-width: 240px; max-height: 200px; border-radius: 10px; margin: 6px 4px; border: 1px solid #2a2d3a; object-fit: cover; cursor: pointer; }
  .message.assistant img:hover { border-color: #7dcea0; }
  .message.assistant table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .message.assistant th { background: #252830; color: #7dcea0; padding: 6px 10px; text-align: left; border-bottom: 2px solid #3a3d4a; font-weight: 600; }
  .message.assistant td { padding: 5px 10px; border-bottom: 1px solid #2a2d3a; color: #d0d0d0; }
  .message.assistant tr:hover td { background: #1e2130; }

  .tool-call {
    font-size: 12px;
    color: #7dcea0;
    background: #1a2e23;
    border: 1px solid #2d5a3d;
    border-radius: 6px;
    padding: 5px 10px;
    font-family: monospace;
    word-break: break-all;
  }

  .typing { color: #666; font-style: italic; padding: 6px 0; }

  .welcome { text-align: center; color: #888; padding: 30px 10px; }
  .welcome h2 { font-size: 22px; color: #7dcea0; margin-bottom: 10px; }
  .welcome p { margin: 4px 0; font-size: 13px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .example-btn {
    background: #252830; border: 1px solid #3a3d4a; border-radius: 8px;
    padding: 6px 12px; color: #a0a8c0; font-size: 12px; cursor: pointer;
  }
  .example-btn:hover { border-color: #7dcea0; color: #7dcea0; }

  #input-area { background: #1a1d27; border-top: 1px solid #2a2d3a; padding: 12px 16px; }
  #input-form { display: flex; gap: 8px; }
  #user-input {
    flex: 1; background: #252830; border: 1px solid #3a3d4a; border-radius: 12px;
    padding: 10px 16px; color: #e0e0e0; font-size: 14px; outline: none;
  }
  #user-input:focus { border-color: #7dcea0; }
  #send-btn {
    background: #2d5a3d; color: #7dcea0; border: none; border-radius: 12px;
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  #send-btn:hover { background: #3a7a50; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Dashboard (collapsible, inside left column) ────────────────── */
  #dashboard {
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  #dashboard.collapsed { max-height: 42px; }
  #dashboard.expanded { max-height: 600px; overflow-y: auto; }

  #dashboard-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    color: #a0a8c0;
  }
  #dashboard-toggle:hover { color: #7dcea0; }
  #dashboard-toggle .arrow { transition: transform 0.3s; font-size: 10px; }
  #dashboard.expanded #dashboard-toggle .arrow { transform: rotate(90deg); }

  #dashboard-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 14px;
  }

  .dash-card {
    background: #252830;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    padding: 12px;
  }
  .dash-card h3 { font-size: 12px; color: #7dcea0; margin-bottom: 8px; font-weight: 600; }
  .dash-card .dash-empty { color: #555; font-size: 12px; font-style: italic; }

  .dash-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0;
    font-size: 12px;
    border-bottom: 1px solid #1a1d27;
  }
  .dash-item:last-child { border-bottom: none; }
  .dash-item .name { color: #e0e0e0; flex: 1; }
  .dash-item .detail { color: #888; font-size: 11px; }

  .iucn-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    color: #fff;
  }
  .iucn-CR { background: #d32f2f; }
  .iucn-EN { background: #e65100; }
  .iucn-VU { background: #f9a825; color: #333; }
  .iucn-NT { background: #1565c0; }

  #hotspot-map {
    width: 100%;
    height: 180px;
    border-radius: 8px;
    margin-top: 6px;
  }
  .hotspot-nearest { font-size: 11px; color: #7dcea0; margin-top: 4px; padding: 3px 0; }

  /* ── Weekend panel ───────────────────────────────────────────────── */
  #weekend-panel {
    display: none;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    padding: 14px 16px;
    max-height: 400px;
    overflow-y: auto;
  }
  #weekend-panel.visible { display: block; }
  #weekend-panel h2 { font-size: 16px; color: #7dcea0; margin-bottom: 10px; }

  .weekend-close {
    float: right;
    background: transparent;
    border: 1px solid #3a3d4a;
    color: #a0a8c0;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .weekend-close:hover { border-color: #7dcea0; color: #7dcea0; }

  .weekend-spot {
    background: #252830;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .weekend-spot h3 { font-size: 13px; color: #f0f0f0; margin-bottom: 3px; }
  .weekend-spot .spot-meta { font-size: 11px; color: #888; margin-bottom: 8px; }

  .weekend-species { display: flex; flex-wrap: wrap; gap: 5px; }

  .species-chip {
    font-size: 11px;
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 6px;
    padding: 3px 8px;
    color: #e0e0e0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .species-chip .mig-icon { font-size: 10px; }
  .species-chip img { width: 20px; height: 20px; border-radius: 3px; object-fit: cover; }

  /* ── Right column: map + cards ─────────────────────────────────── */
  #panels {
    grid-area: panels;
    display: grid;
    grid-template-rows: 1.2fr 1fr;
    min-height: 0;
    min-width: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .panel-header {
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    padding: 8px 14px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #7dcea0;
    font-weight: 600;
  }
  .panel-header .count { color: #6a7a8a; font-weight: 400; margin-left: 8px; }

  #map-panel { border-bottom: 1px solid #2a2d3a; }
  #map { flex: 1; background: #0f1117; }
  .leaflet-container { background: #1a1d27; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #1a1d27; color: #e0e0e0; border: 1px solid #2a2d3a;
  }
  .leaflet-popup-content { font-size: 12px; line-height: 1.5; }
  .leaflet-popup-content b { color: #7dcea0; }
  .leaflet-popup-content em { color: #a0a8c0; }
  .marker-cluster { background: rgba(125, 206, 160, 0.2); }
  .marker-cluster div { background: rgba(45, 90, 61, 0.85); color: #e0e0e0; font-weight: 600; }

  #cards-grid {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .species-card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .species-card:hover { border-color: #7dcea0; transform: translateY(-2px); }
  .species-card .thumb {
    width: 100%;
    height: 90px;
    object-fit: cover;
    background: #252830;
    display: block;
  }
  .species-card .meta { padding: 8px 10px; }
  .species-card .name { font-size: 12px; color: #f0f0f0; font-weight: 600; line-height: 1.3; }
  .species-card .sci { font-size: 11px; color: #7dcea0; font-style: italic; margin-top: 2px; }
  .species-card .obs-count { font-size: 10px; color: #6a7a8a; margin-top: 4px; }

  .panel-loading { padding: 20px; color: #666; font-size: 12px; text-align: center; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-areas: "header" "chat" "panels"; grid-template-rows: auto 1fr 60vh; }
    #chat-column { border-right: none; border-bottom: 1px solid #2a2d3a; }
    #dashboard-content { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Birdology</h1>
  <span class="badge">Graph-RAG</span>
  <button id="weekend-btn">Quoi observer ce week-end ?</button>
  <button id="new-chat-btn">Nouvelle conversation</button>
</header>

<div id="chat-column">
  <div id="weekend-panel"></div>

  <div id="dashboard" class="expanded">
    <div id="dashboard-toggle">
      <span class="arrow">&#9654;</span> Dashboard
    </div>
    <div id="dashboard-content">
      <div class="dash-card" id="dash-rare">
        <h3>Especes menacees</h3>
        <div class="dash-empty">Chargement...</div>
      </div>
      <div class="dash-card" id="dash-hotspots">
        <h3>Hotspots proches de vous</h3>
        <div class="dash-empty">Chargement...</div>
      </div>
    </div>
  </div>

  <div id="chat-container">
    <div class="welcome">
      <h2>Birdology Graph-RAG</h2>
      <p>Posez vos questions sur les oiseaux du Danemark.</p>
      <div class="examples">
        <button class="example-btn">Quels oiseaux pres de Copenhague ?</button>
        <button class="example-btn">Combien d'especes dans le graphe ?</button>
        <button class="example-btn">Parle-moi des Turdides</button>
        <button class="example-btn">Oiseaux menaces au Danemark</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-form">
      <input type="text" id="user-input" placeholder="Posez votre question..." autocomplete="off" />
      <button type="button" id="send-btn">Envoyer</button>
    </div>
  </div>
</div>

<div id="panels">
  <section id="map-panel" class="panel">
    <div class="panel-header">Observations <span class="count" id="map-count"></span></div>
    <div id="map"></div>
  </section>
  <section id="cards-panel" class="panel">
    <div class="panel-header">Especes <span class="count" id="cards-count"></span></div>
    <div id="cards-grid">
      <div class="panel-loading">Chargement…</div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
var chatContainer = document.getElementById('chat-container');
var userInput = document.getElementById('user-input');
var sendBtn = document.getElementById('send-btn');
var newChatBtn = document.getElementById('new-chat-btn');
var firstMsg = true;
var busy = false;

var sessionId = sessionStorage.getItem('birdology_session');
if (!sessionId) {
  sessionId = 'sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
  sessionStorage.setItem('birdology_session', sessionId);
}

function bindExamples(root) {
  root.querySelectorAll('.example-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      userInput.value = btn.textContent;
      doSend();
    });
  });
}
bindExamples(document);

sendBtn.addEventListener('click', function() { doSend(); });
userInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSend(); });

newChatBtn.addEventListener('click', function() {
  if (busy) return;
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId })
  });
  sessionId = 'sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
  sessionStorage.setItem('birdology_session', sessionId);
  chatContainer.innerHTML = '';
  var welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.innerHTML = '<h2>Birdology Graph-RAG</h2>'
    + '<p>Posez vos questions sur les oiseaux du Danemark.</p>'
    + '<div class="examples">'
    + '<button class="example-btn">Quels oiseaux pres de Copenhague ?</button>'
    + '<button class="example-btn">Combien d\'especes dans le graphe ?</button>'
    + '<button class="example-btn">Parle-moi des Turdides</button>'
    + '<button class="example-btn">Oiseaux menaces au Danemark</button>'
    + '</div>';
  chatContainer.appendChild(welcome);
  bindExamples(welcome);
  firstMsg = true;
  userInput.focus();
});

function askAbout(name) {
  userInput.value = 'Parle-moi de ' + name;
  doSend();
}

function doSend() {
  if (busy) return;
  var text = userInput.value.trim();
  if (!text) return;

  if (firstMsg) {
    var w = document.querySelector('.welcome');
    if (w) w.remove();
    firstMsg = false;
  }

  addMsg('user', text);
  userInput.value = '';
  busy = true;
  sendBtn.disabled = true;
  showTyping();

  var controller = new AbortController();
  var timeoutId = setTimeout(function() { controller.abort(); }, 180000);
  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, session_id: sessionId }),
    signal: controller.signal
  })
  .then(function(res) {
    if (!res.ok) return res.text().then(function(t) { throw new Error('Serveur: ' + res.status); });
    return res.json();
  })
  .then(function(data) {
    hideTyping();
    if (data.tool_calls) {
      data.tool_calls.forEach(function(tc) { addTool(tc.name, tc.args); });
    }
    addMsg('assistant', data.answer || 'Pas de reponse.');
  })
  .catch(function(err) {
    hideTyping();
    addMsg('assistant', 'Erreur: ' + err.message);
  })
  .finally(function() {
    clearTimeout(timeoutId);
    busy = false;
    sendBtn.disabled = false;
    userInput.focus();
  });
}

function addMsg(role, content) {
  var div = document.createElement('div');
  div.className = 'message ' + role;
  if (role === 'assistant') div.innerHTML = mdToHtml(content);
  else div.textContent = content;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function addTool(name, args) {
  var div = document.createElement('div');
  div.className = 'tool-call';
  div.textContent = 'tool: ' + name + '(' + JSON.stringify(args) + ')';
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showTyping() {
  var div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-ind';
  div.textContent = 'Recherche dans le graphe...';
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}
function hideTyping() { var el = document.getElementById('typing-ind'); if (el) el.remove(); }

function mdToHtml(text) {
  var lines = text.split('\n'); var out = ''; var inTable = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.trim() === '') continue;
    if (line.match(/^\|?\s*[-:]+[-| :]+$/)) continue;
    if (line.match(/^\|(.+)\|$/)) {
      var cells = line.split('|').filter(function(c, idx, arr) { return idx > 0 && idx < arr.length - 1; });
      if (!inTable) { out += '<table><tr>' + cells.map(function(c) { return '<th>' + inlineFormat(c.trim()) + '</th>'; }).join('') + '</tr>'; inTable = true; }
      else { out += '<tr>' + cells.map(function(c) { return '<td>' + inlineFormat(c.trim()) + '</td>'; }).join('') + '</tr>'; }
      continue;
    }
    if (inTable) { out += '</table>'; inTable = false; }
    line = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (line.match(/^#### /)) { out += '<h4 style="color:#7dcea0;font-size:14px;margin:10px 0 4px">' + inlineFormat(line.substring(5)) + '</h4>'; continue; }
    if (line.match(/^### /))  { out += '<h3>' + inlineFormat(line.substring(4)) + '</h3>'; continue; }
    if (line.match(/^## /))   { out += '<h3>' + inlineFormat(line.substring(3)) + '</h3>'; continue; }
    if (line.match(/^# /))    { out += '<h3>' + inlineFormat(line.substring(2)) + '</h3>'; continue; }
    if (line.match(/^---$/))  { out += '<hr>'; continue; }
    if (line.match(/^\d+\.\s/)) { out += '<li>' + inlineFormat(line.replace(/^\d+\.\s+/, '')) + '</li>'; continue; }
    if (line.match(/^[-•]\s/)) { out += '<li>' + inlineFormat(line.replace(/^[-•]\s+/, '')) + '</li>'; continue; }
    if (out.length > 0 && !out.endsWith('<br>')) out += '<br>';
    out += inlineFormat(line);
  }
  if (inTable) out += '</table>';
  return out;
}

function inlineFormat(line) {
  line = line.replace(/&lt;bird-img name="([^"]*)" src="([^"]*)"&gt;/g,
    '<img src="$2" alt="$1" title="$1" onclick="window.open(this.src,\'_blank\')">');
  line = parseMarkdownLinks(line);
  line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  line = line.replace(/\*(.+?)\*/g, '<em>$1</em>');
  line = line.replace(/`(.+?)`/g, '<code>$1</code>');
  return line;
}

function parseMarkdownLinks(line) {
  var result = ''; var i = 0;
  while (i < line.length) {
    var isImg = false;
    if (line[i] === '!' && line[i+1] === '[') { isImg = true; i++; }
    if (line[i] === '[') {
      var closeB = line.indexOf(']', i+1);
      if (closeB !== -1 && line[closeB+1] === '(') {
        var text = line.substring(i+1, closeB);
        var start = closeB + 2; var depth = 1; var j = start;
        while (j < line.length && depth > 0) {
          if (line[j] === '(') depth++; else if (line[j] === ')') depth--;
          if (depth > 0) j++;
        }
        if (depth === 0) {
          var url = line.substring(start, j);
          if (isImg) result += '<img src="' + url + '" alt="' + text + '" title="' + text + '" onclick="window.open(this.src,\'_blank\')">';
          else result += '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>';
          i = j + 1; continue;
        }
      }
    }
    result += line[i]; i++;
  }
  return result;
}

// ── Observations map (right panel) ───────────────────────────────────────
var map = L.map('map', { preferCanvas: true }).setView([56.0, 11.5], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

var clusters = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
map.addLayer(clusters);

fetch('/api/observations').then(function(r) { return r.json(); }).then(function(obs) {
  document.getElementById('map-count').textContent = obs.length.toLocaleString() + ' points';
  var batch = [];
  obs.forEach(function(o) {
    var name = o.commonName || o.scientificName;
    var popup = '<b>' + escapeHtml(name) + '</b>'
      + (o.scientificName ? '<br><em>' + escapeHtml(o.scientificName) + '</em>' : '')
      + (o.locality ? '<br>' + escapeHtml(o.locality) : '')
      + (o.date ? '<br><small>' + escapeHtml(o.date) + '</small>' : '')
      + '<br><a href="#" onclick="askAbout(\'' + escapeAttr(name) + '\');return false;">Demander au chat</a>';
    var m = L.circleMarker([o.lat, o.lon], { radius: 4, color: '#7dcea0', weight: 1, fillColor: '#2d5a3d', fillOpacity: 0.7 });
    m.bindPopup(popup);
    batch.push(m);
  });
  clusters.addLayers(batch);
  if (batch.length) {
    try { map.fitBounds(clusters.getBounds(), { padding: [20, 20] }); } catch (e) {}
  }
}).catch(function(e) {
  document.getElementById('map-count').textContent = 'erreur';
  console.error(e);
});

// ── Species cards (right panel) ──────────────────────────────────────────
var cardsGrid = document.getElementById('cards-grid');
fetch('/api/species').then(function(r) { return r.json(); }).then(function(species) {
  cardsGrid.innerHTML = '';
  document.getElementById('cards-count').textContent = species.length + ' affichees';
  species.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'species-card';
    var name = s.commonName || s.scientificName;
    var thumb = s.thumbnail ? '<img class="thumb" src="' + escapeAttr(s.thumbnail) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '<div class="thumb"></div>';
    card.innerHTML = thumb
      + '<div class="meta">'
      + '<div class="name">' + escapeHtml(name) + '</div>'
      + (s.scientificName && s.scientificName !== name ? '<div class="sci">' + escapeHtml(s.scientificName) + '</div>' : '')
      + '<div class="obs-count">' + s.obsCount + ' obs.</div>'
      + '</div>';
    card.addEventListener('click', function() { askAbout(name); });
    cardsGrid.appendChild(card);
  });
}).catch(function(e) {
  cardsGrid.innerHTML = '<div class="panel-loading">Erreur de chargement</div>';
  console.error(e);
});

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function escapeAttr(s) { return escapeHtml(s).replace(/\\/g, '\\\\'); }

// ── Dashboard (left column, collapsible) ─────────────────────────────────
var dashToggle = document.getElementById('dashboard-toggle');
var dashboard = document.getElementById('dashboard');

dashToggle.addEventListener('click', function() {
  dashboard.classList.toggle('collapsed');
  dashboard.classList.toggle('expanded');
  if (hotspotMap) setTimeout(function() { hotspotMap.invalidateSize(); }, 350);
});

var hotspotMap = null;
var userLat = null;
var userLon = null;

function loadDashboard() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        if (hotspotMap && hotspotMap._hotspotsData) {
          renderHotspotsMap(hotspotMap._hotspotsData);
        }
      },
      function() {}
    );
  }

  fetch('/api/dashboard')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      renderRare(data.rare || []);
      renderHotspotsMap(data.hotspots || []);
    })
    .catch(function() {
      document.getElementById('dash-rare').innerHTML = '<h3>Especes menacees</h3><div class="dash-empty">Erreur de chargement</div>';
    });
}

function renderRare(items) {
  var card = document.getElementById('dash-rare');
  var html = '<h3>Especes menacees</h3>';
  if (!items.length) { html += '<div class="dash-empty">Aucune espece menacee dans le graphe</div>'; }
  else {
    items.slice(0, 8).forEach(function(r) {
      var name = r.commonNameFr || r.commonNameEn || r.scientificName;
      var loc = r.locality ? ' — ' + r.locality : '';
      html += '<div class="dash-item">'
        + '<span class="iucn-badge iucn-' + r.status + '">' + r.status + '</span>'
        + '<span class="name">' + name + '</span>'
        + '<span class="detail">' + (r.date || '') + loc + '</span>'
        + '</div>';
    });
  }
  card.innerHTML = html;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
        * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function renderHotspotsMap(items) {
  var card = document.getElementById('dash-hotspots');
  card.innerHTML = '<h3>Hotspots proches de vous</h3><div id="hotspot-map"></div><div class="hotspot-nearest" id="nearest-info"></div>';

  if (!items.length) {
    card.innerHTML = '<h3>Hotspots proches de vous</h3><div class="dash-empty">Aucun hotspot dans le graphe</div>';
    return;
  }

  var centerLat = 55.7, centerLon = 10.5, defaultZoom = 7;
  if (userLat !== null) { centerLat = userLat; centerLon = userLon; defaultZoom = 9; }

  if (hotspotMap) { hotspotMap.remove(); hotspotMap = null; }
  hotspotMap = L.map('hotspot-map').setView([centerLat, centerLon], defaultZoom);
  hotspotMap._hotspotsData = items;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  }).addTo(hotspotMap);

  var sorted = items.map(function(h) {
    var lat = parseFloat(h.lat); var lon = parseFloat(h.lon);
    var dist = (userLat !== null) ? haversineKm(userLat, userLon, lat, lon) : null;
    return { lat: lat, lon: lon, locality: h.locality, count: h.count, dist: dist };
  });
  if (userLat !== null) sorted.sort(function(a, b) { return a.dist - b.dist; });

  if (userLat !== null) {
    L.circleMarker([userLat, userLon], { radius: 8, fillColor: '#7dcea0', color: '#fff', weight: 2, fillOpacity: 0.9 })
      .addTo(hotspotMap).bindPopup('Vous');
  }

  sorted.forEach(function(h, i) {
    var maxObs = sorted[0].count;
    var radius = 6 + 10 * (h.count / maxObs);
    var color = (userLat !== null && i < 5) ? '#7dcea0' : '#e65100';
    var fillOpacity = (userLat !== null && i < 5) ? Math.max(0.35, 0.85 - i * 0.1) : 0.5;
    var name = h.locality || (h.lat.toFixed(2) + ', ' + h.lon.toFixed(2));
    var distStr = (h.dist !== null) ? ' (' + h.dist.toFixed(0) + ' km)' : '';
    L.circleMarker([h.lat, h.lon], { radius: radius, fillColor: color, color: '#fff', weight: 1, fillOpacity: fillOpacity })
      .addTo(hotspotMap).bindPopup('<strong>' + name + '</strong><br>' + h.count + ' observations' + distStr);
  });

  var infoDiv = document.getElementById('nearest-info');
  if (userLat !== null && sorted.length > 0) {
    var top3 = sorted.slice(0, 3).map(function(h) {
      var name = h.locality || (h.lat.toFixed(2) + ', ' + h.lon.toFixed(2));
      return name + ' (' + h.dist.toFixed(0) + ' km)';
    });
    infoDiv.textContent = 'Les plus proches : ' + top3.join(' · ');
  } else if (userLat === null) {
    infoDiv.textContent = 'Activez la geolocalisation pour voir les hotspots proches de vous.';
  }

  setTimeout(function() { hotspotMap.invalidateSize(); }, 300);
}

loadDashboard();

// ── Weekend suggestions ──────────────────────────────────────────────────
var weekendBtn = document.getElementById('weekend-btn');
var weekendPanel = document.getElementById('weekend-panel');

var migIcons = { 'Resident': '🏠', 'SummerVisitor': '☀️', 'WinterVisitor': '❄️', 'PassageMigrant': '🌊', 'PartialMigrant': '↔️' };
var migLabels = { 'Resident': 'Resident', 'SummerVisitor': 'Visiteur d\'ete', 'WinterVisitor': 'Visiteur d\'hiver', 'PassageMigrant': 'De passage', 'PartialMigrant': 'Migrateur partiel' };
var monthNames = ['', 'janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];

weekendBtn.addEventListener('click', function() {
  if (weekendPanel.classList.contains('visible')) {
    weekendPanel.classList.remove('visible');
    return;
  }
  weekendBtn.disabled = true;
  weekendPanel.innerHTML = '<h2>Chargement...</h2>';
  weekendPanel.classList.add('visible');

  var url = '/api/weekend';
  if (userLat !== null) url += '?lat=' + userLat + '&lon=' + userLon;

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(data) { renderWeekend(data); })
    .catch(function(err) {
      weekendPanel.innerHTML = '<h2>Erreur</h2><p>' + err.message + '</p>'
        + '<button class="weekend-close" onclick="document.getElementById(\'weekend-panel\').classList.remove(\'visible\')">Fermer</button>';
    })
    .finally(function() { weekendBtn.disabled = false; });
});

function renderWeekend(data) {
  var spots = data.spots || [];
  var month = data.month || new Date().getMonth() + 1;

  var html = '<button class="weekend-close" id="weekend-close-btn">Fermer</button>';
  html += '<h2>Quoi observer en ' + monthNames[month] + ' ?</h2>';

  if (!spots.length) {
    html += '<p style="color:#888">Pas assez de donnees. Lancez <code>python scripts/reason.py</code> pour enrichir le graphe.</p>';
    weekendPanel.innerHTML = html;
    document.getElementById('weekend-close-btn').addEventListener('click', function() {
      weekendPanel.classList.remove('visible');
    });
    return;
  }

  spots.forEach(function(spot) {
    var name = spot.locality || (spot.lat.toFixed(2) + ', ' + spot.lon.toFixed(2));
    html += '<div class="weekend-spot">';
    html += '<h3>' + name + '</h3>';
    html += '<div class="spot-meta">' + spot.dist_km + ' km · ' + spot.obs_count + ' observations</div>';
    if (spot.species && spot.species.length) {
      html += '<div class="weekend-species">';
      spot.species.forEach(function(sp) {
        var displayName = sp.commonNameFr || sp.commonNameEn || sp.scientificName;
        var mig = sp.migrationStatus;
        var icon = migIcons[mig] || '';
        var title = migLabels[mig] || '';
        var iucn = sp.conservationStatus;
        html += '<div class="species-chip" title="' + sp.scientificName + (title ? ' — ' + title : '') + '">';
        if (sp.thumbnail) html += '<img src="' + sp.thumbnail + '" alt="">';
        if (icon) html += '<span class="mig-icon">' + icon + '</span>';
        html += '<span>' + displayName + '</span>';
        if (iucn && iucn !== 'LC') html += ' <span class="iucn-badge iucn-' + iucn + '">' + iucn + '</span>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div style="color:#888;font-size:11px;font-style:italic">Pas de donnees de presence mensuelle</div>';
    }
    html += '</div>';
  });

  weekendPanel.innerHTML = html;
  document.getElementById('weekend-close-btn').addEventListener('click', function() {
    weekendPanel.classList.remove('visible');
  });
}

userInput.focus();
</script>
